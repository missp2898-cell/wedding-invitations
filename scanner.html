{% extends "base.html" %}{% block content %}<section class="card narrow scanner"><p class="eyebrow">ENTRY CHECK-IN</p><h1>فحص QR</h1><p class="muted">اسمح للمتصفح باستخدام الكاميرا ووجّهها إلى الرمز.</p><div id="reader"></div><div id="result">جاهز للفحص.</div><button class="primary" onclick="startScanner()">تشغيل الكاميرا</button><p class="note">أول مسح يقبل الدخول، وأي مسح لاحق يرفض.</p></section><script src="https://unpkg.com/html5-qrcode"></script><script>
let scanner,busy=false;async function scanned(token){if(busy)return;busy=true;let box=document.getElementById('result');box.textContent='جارٍ التحقق...';try{let r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,_csrf:'{{csrf_token()}}'})});let d=await r.json();box.className=d.ok?'ok':'no';box.textContent=d.message+(d.name?' — '+d.name:'')}catch(e){box.className='no';box.textContent='تعذر الاتصال بالخادم.'}setTimeout(()=>busy=false,2500)}
function startScanner(){if(!window.Html5Qrcode){document.getElementById('result').textContent='تعذر تحميل السكانر.';return}if(!scanner)scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},scanned).catch(()=>document.getElementById('result').textContent='اسمح بالكاميرا وافتح الموقع عبر HTTPS.')}
</script>{% endblock %}
