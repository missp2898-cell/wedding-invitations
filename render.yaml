services:
  - type: web
    name: wedding-qr
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    disk:
      name: wedding-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/wedding_qr.sqlite3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: ayoub
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
